<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}QA Sentinel{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ──────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ─────────────────────────────────────────────────── */
    :root {
      /* Brand */
      --primary:        #6366f1;   /* Indigo */
      --primary-dark:   #4f46e5;
      --primary-light:  #e0e7ff;
      --primary-glow:   rgba(99,102,241,.12);
      --accent:         #ec4899;   /* Pink */
      --accent-dark:    #db2777;

      /* Semantic */
      --success:        #10b981;
      --success-bg:     rgba(16,185,129,.12);
      --success-text:   #065f46;
      --success-border: #10b981;

      --warning:        #f59e0b;
      --warning-bg:     rgba(245,158,11,.10);
      --warning-text:   #92400e;
      --warning-border: #f59e0b;

      --danger:         #ef4444;
      --danger-bg:      rgba(239,68,68,.10);
      --danger-text:    #991b1b;
      --danger-border:  #ef4444;

      --info:           #0ea5e9;
      --info-bg:        rgba(14,165,233,.10);
      --info-text:      #0c4a6e;
      --info-border:    #0ea5e9;

      /* Backgrounds */
      --bg:             #f8fafc;   /* Soft gray-blue page bg */
      --bg2:            #f1f5f9;   /* Slightly darker for inputs */
      --card:           #ffffff;   /* White cards */
      --card-hover:     #fafbff;

      /* Borders */
      --border:         #e2e8f0;
      --border-light:   #f1f5f9;

      /* Text */
      --text:           #1e293b;   /* Dark slate primary */
      --text-2:         #334155;   /* Slightly lighter */
      --muted:          #64748b;   /* Medium gray */
      --muted-light:    #94a3b8;   /* Light gray */

      /* Radii */
      --radius:         12px;
      --radius-sm:      8px;
      --radius-lg:      16px;

      /* Shadows */
      --shadow-sm:  0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
      --shadow-md:  0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.05);
      --shadow-lg:  0 10px 15px rgba(0,0,0,.08), 0 4px 6px rgba(0,0,0,.05);
      --shadow-xl:  0 20px 25px rgba(0,0,0,.09), 0 10px 10px rgba(0,0,0,.04);
      --shadow-glow: 0 0 0 3px var(--primary-glow);
    }

    /* ── Base ──────────────────────────────────────────────────────────── */
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      font-size: 14px;
    }

    h1, h2, h3, .nav-brand-text {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    /* ── Navigation ────────────────────────────────────────────────────── */
    nav {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: .55rem;
      margin-right: 2rem;
      text-decoration: none;
      flex-shrink: 0;
    }
    .nav-brand-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      box-shadow: 0 2px 8px rgba(99,102,241,.35);
      flex-shrink: 0;
    }
    .nav-brand-text {
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: -.4px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    nav a.nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: .82rem;
      font-weight: 600;
      padding: .45rem .85rem;
      border-radius: 7px;
      transition: all .18s;
      white-space: nowrap;
      letter-spacing: .01em;
    }
    nav a.nav-link:hover {
      color: var(--primary);
      background: var(--primary-light);
    }
    nav a.nav-link.active {
      color: var(--primary);
      background: var(--primary-light);
    }
    nav a.nav-link.dsat {
      color: #be185d;
    }
    nav a.nav-link.dsat:hover {
      background: rgba(236,72,153,.1);
      color: #9d174d;
    }
    .nav-spacer { flex: 1; }
    .nav-setup {
      border: 1.5px solid var(--border) !important;
      color: var(--muted) !important;
    }
    .nav-setup:hover {
      border-color: var(--primary) !important;
      color: var(--primary) !important;
      background: var(--primary-light) !important;
    }

    /* ── Layout ────────────────────────────────────────────────────────── */
    .container {
      max-width: 1180px;
      margin: 2rem auto;
      padding: 0 1.75rem;
    }

    /* ── Typography ────────────────────────────────────────────────────── */
    h1 {
      font-size: 1.625rem;
      font-weight: 800;
      letter-spacing: -.5px;
      color: var(--text);
      margin-bottom: 1.5rem;
      line-height: 1.2;
    }
    h2 {
      font-size: .9rem;
      font-weight: 700;
      color: var(--text-2);
      margin-bottom: .9rem;
      letter-spacing: -.1px;
    }

    /* ── Page header ───────────────────────────────────────────────────── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
      gap: .75rem;
    }
    .page-header h1 { margin-bottom: 0; }
    .breadcrumb {
      font-size: .78rem;
      color: var(--muted-light);
      display: flex;
      align-items: center;
      gap: .35rem;
      margin-bottom: .3rem;
    }
    .breadcrumb a { color: var(--muted-light); text-decoration: none; }
    .breadcrumb a:hover { color: var(--primary); }

    /* ── Gradient text ─────────────────────────────────────────────────── */
    .gradient-text {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Cards ─────────────────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s, transform .2s;
    }
    .card:hover {
      box-shadow: var(--shadow-md);
    }

    /* ── Stat cards ────────────────────────────────────────────────────── */
    .stat-card {
      text-align: center;
      padding: 1.6rem 1.25rem 1.4rem;
      position: relative;
      overflow: hidden;
    }
    .stat-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary-light), transparent);
      opacity: .6;
    }
    .stat-card .stat-icon {
      font-size: 1.6rem;
      display: block;
      margin-bottom: .55rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.12));
    }
    .stat-card .value {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -.7px;
      line-height: 1;
      margin-bottom: .35rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .stat-card .label {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted-light);
    }

    /* ── Grids ─────────────────────────────────────────────────────────── */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem; }

    /* ── Buttons ───────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .6rem 1.25rem;
      border-radius: var(--radius-sm);
      font-size: .84rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all .25s ease;
      white-space: nowrap;
      letter-spacing: .01em;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      box-shadow: 0 4px 6px rgba(99,102,241,.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px rgba(99,102,241,.3);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #c7d2fe;
    }
    .btn-secondary:hover {
      background: #c7d2fe;
      transform: translateY(-1px);
    }
    .btn-success {
      background: linear-gradient(135deg, var(--success), #059669);
      color: #fff;
      box-shadow: 0 4px 6px rgba(16,185,129,.25);
    }
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px rgba(16,185,129,.25);
    }
    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #dc2626);
      color: #fff;
      box-shadow: 0 4px 6px rgba(239,68,68,.25);
    }
    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px rgba(239,68,68,.25);
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1.5px solid var(--border);
    }
    .btn-ghost:hover {
      background: var(--bg2);
      color: var(--text);
      border-color: var(--muted-light);
    }
    .btn-sm  { padding: .35rem .8rem; font-size: .78rem; border-radius: 6px; }
    .btn-lg  { padding: .8rem 1.75rem; font-size: .95rem; border-radius: 10px; }
    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
    }

    /* ── Badges ────────────────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: .2rem;
      padding: .25rem .6rem;
      border-radius: 6px;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .01em;
    }
    .badge-green  { background: var(--success-bg);  color: var(--success-text); }
    .badge-yellow { background: var(--warning-bg);  color: var(--warning-text); }
    .badge-red    { background: var(--danger-bg);   color: var(--danger-text);  }
    .badge-blue   { background: var(--info-bg);     color: var(--info-text);    }
    .badge-purple { background: var(--primary-light); color: #4338ca; }
    .badge-pink   { background: rgba(236,72,153,.1); color: #9d174d; }

    /* ── Score ring ────────────────────────────────────────────────────── */
    .score-ring {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      font-size: 1.4rem;
      font-weight: 800;
      border: 4px solid;
      flex-shrink: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .score-ring.good { border-color: var(--success); color: var(--success-text); background: var(--success-bg); }
    .score-ring.ok   { border-color: var(--warning); color: var(--warning-text); background: var(--warning-bg); }
    .score-ring.bad  { border-color: var(--danger);  color: var(--danger-text);  background: var(--danger-bg);  }

    /* ── Tables ────────────────────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    thead tr { background: var(--bg); }
    th {
      text-align: left;
      padding: .6rem 1rem;
      border-bottom: 2px solid var(--border);
      color: var(--muted);
      font-weight: 700;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .09em;
    }
    td { padding: .75rem 1rem; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .15s; }
    tbody tr:hover td { background: #fafbff; }

    /* ── Forms ─────────────────────────────────────────────────────────── */
    .form-group { margin-bottom: 1.1rem; }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      margin-bottom: .4rem;
      color: var(--text-2);
      letter-spacing: .02em;
    }
    input[type=text], input[type=number], select, textarea {
      width: 100%;
      padding: .65rem .9rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: .875rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color .18s, box-shadow .18s, background .18s;
      background: var(--bg2);
      color: var(--text);
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: var(--shadow-glow);
    }
    textarea {
      min-height: 200px;
      resize: vertical;
      font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
      font-size: .82rem;
      line-height: 1.7;
    }
    select { cursor: pointer; }

    /* ── Progress bar ──────────────────────────────────────────────────── */
    .progress-bar {
      height: 8px;
      background: var(--bg2);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width .6s cubic-bezier(.4,0,.2,1);
    }

    /* ── Feedback items (colored left border) ──────────────────────────── */
    .feedback-item {
      padding: .6rem .85rem;
      border-radius: var(--radius-sm);
      border-left: 4px solid;
      font-size: .84rem;
      line-height: 1.55;
      margin-bottom: .45rem;
    }
    .feedback-good {
      border-left-color: var(--success-border);
      background: var(--success-bg);
      color: var(--success-text);
    }
    .feedback-warn {
      border-left-color: var(--warning-border);
      background: var(--warning-bg);
      color: var(--warning-text);
    }
    .feedback-bad {
      border-left-color: var(--danger-border);
      background: var(--danger-bg);
      color: var(--danger-text);
    }
    .feedback-info {
      border-left-color: var(--info-border);
      background: var(--info-bg);
      color: var(--info-text);
    }

    /* ── Alerts ────────────────────────────────────────────────────────── */
    .alert {
      padding: .85rem 1.1rem;
      border-radius: var(--radius-sm);
      font-size: .84rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: flex-start;
      gap: .65rem;
      border-left: 4px solid;
    }
    .alert-info   { background: var(--info-bg);    border-left-color: var(--info);    color: var(--info-text);    border: 1px solid rgba(14,165,233,.2); border-left: 4px solid var(--info);   }
    .alert-warn   { background: var(--warning-bg); border-left-color: var(--warning); color: var(--warning-text); border: 1px solid rgba(245,158,11,.2); border-left: 4px solid var(--warning); }
    .alert-danger { background: var(--danger-bg);  border-left-color: var(--danger);  color: var(--danger-text);  border: 1px solid rgba(239,68,68,.2);  border-left: 4px solid var(--danger);  }

    /* ── Checklists ────────────────────────────────────────────────────── */
    ul.checklist { list-style: none; padding: 0; }
    ul.checklist li {
      padding: .5rem 0 .5rem 1.6rem;
      position: relative;
      font-size: .875rem;
      line-height: 1.55;
      border-bottom: 1px solid var(--border-light);
    }
    ul.checklist li:last-child { border-bottom: none; }
    ul.checklist li::before {
      content: "✓";
      position: absolute; left: 0;
      color: var(--success);
      font-weight: 800;
    }
    ul.checklist.bad li::before { content: "✗"; color: var(--danger); }

    /* ── Section label ─────────────────────────────────────────────────── */
    .section-label {
      font-size: .69rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted-light);
      margin-bottom: .6rem;
    }

    /* ── Code ──────────────────────────────────────────────────────────── */
    code {
      background: var(--primary-light);
      color: var(--primary);
      padding: .1rem .4rem;
      border-radius: 4px;
      font-size: .8rem;
      font-family: 'SF Mono', 'Consolas', monospace;
    }

    /* ── Tip text ──────────────────────────────────────────────────────── */
    .tip {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .77rem;
      color: var(--muted-light);
      margin-top: .35rem;
    }

    /* ── Scrollbar ─────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* ── Utilities ─────────────────────────────────────────────────────── */
    .text-muted  { color: var(--muted); }
    .text-sm     { font-size: .82rem; }
    .text-xs     { font-size: .75rem; }
    .font-bold   { font-weight: 700; }
    .mt-1  { margin-top: .5rem; }
    .mt-2  { margin-top: 1rem; }

    /* ── Score bubble (inline stat) ────────────────────────────────────── */
    .score-bubble {
      display: inline-block;
      padding: .2rem .55rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: .82rem;
    }
    .score-high { color: var(--success-text); background: var(--success-bg); }
    .score-mid  { color: var(--warning-text); background: var(--warning-bg); }
    .score-low  { color: var(--danger-text);  background: var(--danger-bg);  }

    /* ── Divider ───────────────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.25rem 0;
    }

    /* ── Mobile ────────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .grid2, .grid3, .grid4 { grid-template-columns: 1fr; }
      nav { padding: 0 1rem; }
      nav a.nav-link { padding: .4rem .6rem; font-size: .77rem; }
      .container { padding: 0 1rem; margin: 1rem auto; }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<!-- ── Top Navigation ──────────────────────────────────────────────────── -->
<nav>
  <a href="/" class="nav-brand">
    <div class="nav-brand-icon">🔍</div>
    <span class="nav-brand-text">QA Sentinel</span>
  </a>
  <a href="/"           class="nav-link">Dashboard</a>
  <a href="/review/new" class="nav-link">+ New Review</a>
  <a href="/sops"       class="nav-link">SOPs</a>
  <a href="/agents"     class="nav-link">Agents</a>
  <a href="/reports"    class="nav-link">Reports</a>
  <a href="/dsat"           class="nav-link dsat">⚠ DSAT</a>
  <a href="/dsat/dashboard" class="nav-link dsat">📊 DSAT Board</a>
  <span class="nav-spacer"></span>
  <a href="/health" class="nav-link nav-setup">⚙ Setup</a>
  {% if current_user is defined and current_user %}
  <span style="display:flex;align-items:center;gap:.5rem;margin-left:.75rem;padding-left:.75rem;border-left:1px solid var(--border);">
    <span style="font-size:.78rem;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
          title="{{ current_user.email }}">{{ current_user.name }}</span>
    {% if current_user.role == 'admin' %}
    <a href="/admin/users" class="btn btn-sm btn-secondary" style="padding:.3rem .65rem;">👥 Users</a>
    {% endif %}
    <a href="/logout" class="btn btn-sm btn-ghost" style="padding:.3rem .65rem;">Sign out</a>
  </span>
  {% endif %}
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
