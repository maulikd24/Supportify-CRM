<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First-time Setup — QA Sentinel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f13;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 48px rgba(0,0,0,.4);
    }
    .logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #818cf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: .25rem;
    }
    .subtitle { font-size: .84rem; color: #6b7280; margin-bottom: 1.25rem; }
    .info-banner {
      background: rgba(99,102,241,.1);
      border: 1px solid rgba(99,102,241,.25);
      border-radius: 8px;
      color: #a5b4fc;
      font-size: .82rem;
      line-height: 1.55;
      padding: .75rem .9rem;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: .4rem;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    input {
      width: 100%;
      background: #111118;
      border: 1px solid #2a2a38;
      border-radius: 8px;
      color: #f3f4f6;
      font-family: inherit;
      font-size: .9rem;
      padding: .7rem .9rem;
      margin-bottom: 1.1rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #818cf8; }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: .95rem;
      font-weight: 700;
      padding: .75rem;
      cursor: pointer;
      transition: opacity .15s;
      margin-top: .5rem;
    }
    .btn:hover { opacity: .9; }
    .error {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px;
      color: #fca5a5;
      font-size: .84rem;
      padding: .7rem .9rem;
      margin-bottom: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">QA Sentinel</div>
    <div class="subtitle">First-time setup</div>
    <div class="info-banner">
      No accounts exist yet. Create your admin account below — you'll use this to manage team members and SOPs.
    </div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/setup">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="Jane Smith" required autofocus>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@company.com" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Min. 8 characters" required minlength="8">
      <button type="submit" class="btn">Create Admin Account</button>
    </form>
  </div>
</body>
</html>
