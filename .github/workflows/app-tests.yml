name: App tests

on:
  push:
    branches: [main, develop]
    paths: ["app/**", ".github/workflows/app-tests.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-tests.yml"]

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supportify_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supportify_test
      # prisma.config.ts reads DATABASE_URL for `prisma generate`; never a real database here.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supportify_test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      - name: Tests (billing, tenant isolation, permissions, security, auto-review)
        run: npm test
