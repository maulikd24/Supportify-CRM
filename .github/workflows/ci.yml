name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supportify_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The suite applies the real migrations to this empty database (tests/setup/global-setup.ts).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supportify_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Lint is not a gate yet: the existing codebase has 7 known lint errors. Add `npm run lint` here once they're fixed.
      - run: npm test
